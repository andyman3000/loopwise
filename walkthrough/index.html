<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discovery walkthrough</title><style>
:root{--bg:#faf8f4;--fg:#22262b;--muted:#5b636c;--accent:#2f5d62;--accent-fg:#fff;--line:#c9c3b8;--card:#fff;--chip:#efebe4}
@media (prefers-color-scheme:dark){:root{--bg:#1b1e21;--fg:#e8e6e1;--muted:#a3a8ad;--accent:#7fb3b8;--accent-fg:#10201f;--line:#4a5056;--card:#23272b;--chip:#2c3135}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:18px/1.35 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 20px;border-bottom:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:14px;min-width:0}
.arrow{font:inherit;font-size:26px;line-height:1;width:48px;height:48px;flex:none;border-radius:50%;border:2px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer}
.arrow:hover:not(:disabled){background:var(--accent);color:var(--accent-fg)}
.arrow:disabled{opacity:.3;cursor:default}
#now{display:flex;flex-direction:column;min-width:0}
#now .top{display:flex;align-items:baseline;gap:12px;min-width:0}
#now .n{font-size:20px;font-weight:700;color:var(--muted);white-space:nowrap}
#now .grp{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);white-space:nowrap}
#now h1{font-size:30px;line-height:1.15;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now .sub{font-size:17px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center}
.steps .seg{display:flex;gap:4px;align-items:center}
.steps .seg span{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;margin-right:4px}
.dot{font:inherit;font-size:13px;font-weight:700;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;padding:0}
.dot.past{border-color:var(--accent);color:var(--accent)}
.dot[aria-current=step]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);transform:scale(1.15)}
.zoom[hidden]{display:none}
.zoom{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.zoom .arrow{width:40px;height:40px;font-size:24px}
#zl{font:inherit;font-size:15px;font-weight:700;min-width:58px;padding:6px 4px;border:0;background:none;color:var(--muted);cursor:pointer}
.dot:focus-visible,.arrow:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
main{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden}
iframe.on{visibility:visible}</style></head><body>

uilt" aria-label="Step 10: Built">10</button><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;11 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;format-quiz&lt;/span&gt;&lt;h1&gt;Fix: overlay&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Fix: the quiz opens in an overlay, second way in from the inquiry form · skill: build · no change on the tree&lt;/div&gt;" title="11. Fix: overlay" aria-label="Step 11: Fix: overlay">11</button></div><div class="seg"><span>Next ideas</span><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;12 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;Next ideas&lt;/span&gt;&lt;h1&gt;Two more ideas&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Two more ideas picked: call-slot and short-form · skill: intent-and-ideas&lt;/div&gt;" title="12. Two more ideas" aria-label="Step 12: Two more ideas">12</button></div><div class="seg"><span>call-slot</span><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;13 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;call-slot&lt;/span&gt;&lt;h1&gt;Test card&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Prototype test card · skill: test-card call-slot prototype&lt;/div&gt;" title="13. Test card" aria-label="Step 13: Test card">13</button><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;14 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;call-slot&lt;/span&gt;&lt;h1&gt;Spec&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Spec in learn mode · skill: variant-spec call-slot learn&lt;/div&gt;" title="14. Spec" aria-label="Step 14: Spec">14</button><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;15 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;call-slot&lt;/span&gt;&lt;h1&gt; t;span class=&quot;n&quot;&gt;20 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;call-slot&lt;/span&gt;&lt;h1&gt;Learning card draft&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Learning card draft (decision 003) from persona runs only, no test with people yet, decision open · skill: learning-card&lt;/div&gt;" title="20. Learning card draft" aria-label="Step 20: Learning card draft">20</button><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;21 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;call-slot&lt;/span&gt;&lt;h1&gt;Product lead's decisions&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Product lead's decisions on the test card, the spec and decision 003; the decision itself stays open&lt;/div&gt;" title="21. Product lead's decisions" aria-label="Step 21: Product lead's decisions">21</button><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;22 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;call-slot&lt;/span&gt;&lt;h1&gt;Rework: calendar, close&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Rework after the product lead looked at it: calendar for the day, close button, booked message in view · skill: build · no change on the tree&lt;/div&gt;" title="22. Rework: calendar, close" aria-label="Step 22: Rework: calendar, close">22</button></div><div class="seg"><span>short-form</span><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;23 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;short-form&lt;/span&gt;&lt;h1&gt;Test card&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Prototype test card · skill: test-card short-form prototype&lt;/div&gt;" title="23. Test card" aria-label="Step 23: Test card">23</button><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;24 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;short-form&lt;/span&gt;&lt;h1&gt;Spec&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Spec in learn mode · skill: variant-spec short-form learn&lt;/div&gt;" title="24. Spec" aria-label="Step 24: Spec">24</button><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;25 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;short-form&lt;/span&gt;&lt;h1&gt;Built&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Page built · skill: build&lt;/div&gt;" title="25. Built" aria-label="Step 25: Built">25</button><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;26 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;short-form&lt;/span&gt;&lt;h1&gt;Persona run 1&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Persona walkthrough on the page, run 1 · skill: persona-walkthrough short-form page&lt;/div&gt;" title="26. Persona run 1" aria-label="Step 26: Persona run 1">26</button><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;27 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;short-form&lt;/span&gt;&lt;h1&gt;Fix from run 1&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Fix from persona run 1: a hint on the formats page, the lead line names what the call asks · skill: build&lt;/div&gt;" title="27. Fix from run 1" aria-label="Step 27: Fix from run 1">27</button><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;28 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;short-form&lt;/span&gt;&lt;h1&gt;Persona run 2&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Persona walkthrough on the page, run 2 · skill: persona-walkthrough short-form page&lt;/div&gt;" title="28. Persona run 2" aria-label="Step 28: Persona run 2">28</button><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;29 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;short-form&lt;/span&gt;&lt;h1&gt;Learning card draft&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Learning card draft (decision 004) from persona runs only, no test with people yet, decision open · skill: learning-card&lt;/div&gt;" title="29. Learning card draft" aria-label="Step 29: Learning card draft">29</button></div><div class="seg"><span>Open points</span><button type="button" class="dot" data-head="&lt;div class=&quot;top&quot;&gt;&lt;span class=&quot;n&quot;&gt;30 / 30&lt;/span&gt;&lt;span class=&quot;grp&quot;&gt;Open points&lt;/span&gt;&lt;h1&gt;Agent answers kept&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Agent answers kept on the open points; learning cards: test the contrasting variants with people, then merge; go on, rework or drop stays open&lt;/div&gt;" title="30. Agent answers kept" aria-label="Step 30: Agent answers kept">30</button></div></nav></header>

<script>
const frames=[...document.querySelectorAll('iframe')],dots=[...document.querySelectorAll('.dot')];
const head=document.getElementById('now'),prev=document.getElementById('prev'),next=document.getElementById('next');let cur=0;
function show(i){cur=Math.max(0,Math.min(frames.length-1,i));
frames.forEach((f,k)=>f.classList.toggle('on',k===cur));dots.forEach((b,k)=>{b.setAttribute('aria-current',k===cur?'step':'false');b.classList.toggle('past',k<cur)});
head.innerHTML=dots[cur].dataset.head;prev.disabled=cur===0;next.disabled=cur===frames.length-1;
try{history.replaceState(null,'','#'+(cur+1))}catch(e){}if(typeof zoomBar==='function')zoomBar()}
dots.forEach((b,k)=>b.addEventListener('click',()=>show(k)));
prev.addEventListener('click',()=>show(cur-1));next.addEventListener('click',()=>show(cur+1));
// Zoom for the projector, for the steps whose view has no zoom of its own (the opportunity map).
// The tree views fit and zoom themselves (Overview, Funnel, C1 ...) and keep their own keys, 0 included.
// Scales the snapshot, not the header, and holds across steps. Keys + - 0.
const ZOOMS=[0.75,1,1.25,1.5,1.75,2,2.5],zl=document.getElementById('zl');let zi=1;
try{const z=ZOOMS.indexOf(Number(localStorage.getItem('walkthrough-zoom')));if(z>=0)zi=z}catch(e){}
function own(f){try{return !!f.contentDocument.getElementById('world')}catch(e){return true}}
function applyZoom(f){if(!own(f))try{f.contentDocument.documentElement.style.zoom=ZOOMS[zi]}catch(e){}}
function zoomBar(){document.querySelector('.zoom').hidden=own(frames[cur])}
function zoom(i){zi=Math.max(0,Math.min(ZOOMS.length-1,i));frames.forEach(applyZoom);zl.textContent=Math.round(ZOOMS[zi]*100)+'%';
document.getElementById('zout').disabled=zi===0;document.getElementById('zin').disabled=zi===ZOOMS.length-1;
try{localStorage.setItem('walkthrough-zoom',String(ZOOMS[zi]))}catch(e){}}
document.getElementById('zout').addEventListener('click',()=>zoom(zi-1));document.getElementById('zin').addEventListener('click',()=>zoom(zi+1));
zl.addEventListener('click',()=>zoom(1));
function key(e){if(e.metaKey||e.ctrlKey||e.altKey||own(frames[cur])){}else if(e.key==='+'||e.key==='=')return zoom(zi+1),e.preventDefault();else if(e.key==='-')return zoom(zi-1),e.preventDefault();else if(e.key==='0')return zoom(1),e.preventDefault();
if(e.key==='PageDown')return show(cur+1),e.preventDefault();if(e.key==='PageUp')return show(cur-1),e.preventDefault();
if(e.currentTarget!==window)return;if(e.key==='ArrowRight')show(cur+1),e.preventDefault();else if(e.key==='ArrowLeft')show(cur-1),e.preventDefault();
else if(e.key==='Home')show(0);else if(e.key==='End')show(frames.length-1);}
window.addEventListener('keydown',key);
frames.forEach((f,k)=>f.addEventListener('load',()=>{applyZoom(f);if(k===cur)zoomBar();try{f.contentWindow.addEventListener('keydown',key)}catch(e){}}));
zoom(zi);show((parseInt(location.hash.slice(1),10)||1)-1);</script></body></html>
