<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inquiry - Loopwise</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Loopwise</a>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/formats.html">Formats</a>
      <a href="/inquiry.html" aria-current="page">Inquiry</a>
      <a href="/sponsor-prep.html">Sponsor preparation</a>
    </nav>
  </header>
  <main>
    <h1>Inquiry</h1>
    <p class="lead">Tell us a little about you and what you need.</p>
    <form id="inquiry-form" novalidate>
      <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name"><p class="error" data-error-for="name" hidden></p></div>
      <div class="field"><label for="company">Company</label><input id="company" name="company" autocomplete="organization"><p class="error" data-error-for="company" hidden></p></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><p class="error" data-error-for="email" hidden></p></div>
      <div class="field"><label for="teamSize">Team size (optional)</label><input id="teamSize" name="teamSize" type="number" min="1" inputmode="numeric"><p class="error" data-error-for="teamSize" hidden></p></div>
      <div class="field"><label for="message">What do you need?</label><textarea id="message" name="message" rows="6"></textarea><p class="error" data-error-for="message" hidden></p></div>
      <p class="error" id="form-error" role="alert" hidden></p>
      <button class="button" type="submit">Send inquiry</button>
    </form>
  </main>
  <footer class="site-footer">Loopwise is a fictional academy used for a demo.</footer>
  <script type="module">
    import { initInquiryForm } from '/components/inquiry-form.js';
    import { logEvent } from '/components/events.js';
    logEvent('page_view', { page: 'inquiry' }, 'baseline');
    initInquiryForm(document.getElementById('inquiry-form'), { variant: 'baseline' });
  </script>
</body>
</html>
